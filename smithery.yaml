# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/src/mcp-stdio-server.js'], env: { DB_FILENAME: config.dbFilename, DEBUG: config.debug } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      dbFilename:
        type: string
        default: memory-bank.kuzu
        description: Filename for the KùzuDB database file
      debug:
        type: string
        default: "1"
        description: Debug logging level
  exampleConfig:
    dbFilename: memory-bank.kuzu
    debug: "1"
